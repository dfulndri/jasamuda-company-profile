services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: jasamuda_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    networks:
      - jasamuda_network
    depends_on:
      - db

  webserver:
    image: nginx:alpine
    container_name: jasamuda_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - jasamuda_network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: jasamuda_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: jasamuda_db
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_USER: jasamuda_user
      MYSQL_PASSWORD: jasamuda_pass
    ports:
      - "3306:3306"
    volumes:
      - jasamuda_dbdata:/var/lib/mysql
    networks:
      - jasamuda_network

networks:
  jasamuda_network:
    driver: bridge

volumes:
  jasamuda_dbdata:
    driver: local